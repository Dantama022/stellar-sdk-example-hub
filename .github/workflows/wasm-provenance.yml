name: WASM Provenance Analysis

on:
  push:
    paths:
      - 'examples/wasm-provenance/**'
      - '.github/workflows/wasm-provenance.yml'
  pull_request:
    paths:
      - 'examples/wasm-provenance/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - run: npm run test:wasm-provenance